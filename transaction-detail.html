<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receipt Detail — NVS-OS Prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
</head>
<body>

<div class="dev-tag">DEV PROTOTYPE — not production data</div>

<div id="navbar"></div>
<div class="subnav" id="subnav"></div>

<main style="max-width:1100px">
  <div class="back-link" id="backLink">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to Transactions
  </div>

  <div class="detail-header">
    <div>
      <h1 id="rcptTitle"></h1>
      <div class="detail-sub" id="rcptSub"></div>
      <div style="display:flex;gap:10px;margin-top:12px;align-items:center" id="statusRow"></div>
    </div>
    <div class="kebab-wrap">
      <div class="more-btn" id="kebabBtn" style="background:var(--surface);box-shadow:0 2px 8px rgba(16,40,90,0.08)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></div>
      <div class="menu" id="kebabMenu" hidden style="top:44px">
        <div class="menu-item" id="downloadItem">Download</div>
        <div class="menu-item" id="emailItem">Email Receipt</div>
      </div>
    </div>
  </div>

  <div class="detail-grid">
    <div class="card">
      <h2>Receipt Information</h2>
      <div class="info-grid">
        <div class="info-field"><label>Paid Amount</label><div class="val" id="f-amount" style="font-size:18px"></div></div>
        <div class="info-field"><label>Transaction Date</label><div class="val" id="f-trxDate"></div></div>
        <div class="info-field"><label>Payment Mode</label><div class="val" id="f-mode"></div></div>
        <div class="info-field"><label>Bank In Description</label><div class="val muted" id="f-bankDesc"></div></div>
        <div class="info-field" style="grid-column:1/-1">
          <div class="field-with-action">
            <div><label>Remarks</label><div class="val muted" id="f-remarks"></div></div>
            <div class="icon-btn" id="editRemarksBtn" title="Edit remarks"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Product &amp; Customer Details</h2>
      <div class="info-grid cols-1">
        <div class="info-field"><label>File No.</label><div class="val" id="f-fileNo" style="color:var(--navy);cursor:pointer"></div></div>
        <div class="info-field"><label>Product Description</label><div class="val" id="f-product"></div></div>
      </div>
      <div class="divider"></div>
      <div class="info-grid">
        <div class="info-field"><label>Customer Name</label><div class="val" id="f-custName"></div></div>
        <div class="info-field"><label>NRIC No.</label><div class="val" id="f-nric"></div></div>
        <div class="info-field"><label>Mobile No.</label><div class="val" id="f-mobile"></div></div>
        <div class="info-field"><label>Email Address</label><div class="val" id="f-email"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Receipt Allocation</h2>
    <table class="line-items">
      <thead><tr><th>Invoice No.</th><th>Description</th><th class="num">Allocated Amount</th></tr></thead>
      <tbody id="allocBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Attachments</h2>
    <div id="attachments"></div>
  </div>

  <div class="card">
    <h2>Activity Log</h2>
    <ul class="timeline" id="timeline"></ul>
  </div>
</main>

<div class="footer">© 2026 Nirvana Memorial Garden Pte. Ltd. — Business Operations Admin</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="assets/chrome.js"></script>
<script>
(function(){
  NvsChrome.mountNavbar('navbar');
  NvsChrome.mountSubnav('subnav', 'transactions');
  document.getElementById('backLink').addEventListener('click', function(){ window.location.href = 'transactions.html'; });

  var DATA = [
    { id:'1', receiptNo:'RCT000501', fileNo:'F0004821', product:'Eternal Garden — Double Niche', customer:'Michelle Tay', status:'Paid', mode:'PAYNOW', trxDate:'20 Feb 2026', remarks:'Full settlement', createdBy:'Grace Lim', createdAt:'20 Feb 2026, 9:14 AM', invoiceNo:'INV000210', amount:2200 },
    { id:'2', receiptNo:'RCT000502', fileNo:'F0004822', product:'Lotus Court — Columbarium Niche', customer:'Wei Ling Koh', status:'Paid', mode:'NETS', trxDate:'20 Feb 2026', remarks:'Deposit — 1 of 3', createdBy:'Grace Lim', createdAt:'20 Feb 2026, 11:02 AM', invoiceNo:'INV000211', amount:500 },
    { id:'3', receiptNo:'RCT000503', fileNo:'F0004823', product:'Serenity Garden — Family Plot', customer:'Rajesh Kumar', status:'Void', mode:'CHEQUE', trxDate:'19 Feb 2026', remarks:'Cheque bounced, reissued', createdBy:'Daniel Ng', createdAt:'19 Feb 2026, 2:47 PM', invoiceNo:'INV000212', amount:8600 },
    { id:'4', receiptNo:'RCT000504', fileNo:'F0004824', product:'Eternal Garden — Single Niche', customer:'Amanda Lim', status:'Paid', mode:'GIRO', trxDate:'18 Feb 2026', remarks:'', createdBy:'Daniel Ng', createdAt:'18 Feb 2026, 10:30 AM', invoiceNo:'INV000213', amount:1950 },
    { id:'5', receiptNo:'RCT000505', fileNo:'F0004825', product:'Lotus Court — Double Niche', customer:'David Lim', status:'Paid', mode:'CASH', trxDate:'20 Feb 2026', remarks:'Final installment', createdBy:'Grace Lim', createdAt:'20 Feb 2026, 4:12 PM', invoiceNo:'INV000214', amount:3200 },
    { id:'6', receiptNo:'RCT000506', fileNo:'F0004826', product:'Serenity Garden — Urn Plot', customer:'Nur Aisyah', status:'Paid', mode:'PAYNOW', trxDate:'17 Feb 2026', remarks:'', createdBy:'Daniel Ng', createdAt:'17 Feb 2026, 9:55 AM', invoiceNo:'INV000215', amount:4100 },
    { id:'7', receiptNo:'RCT000507', fileNo:'F0004827', product:'Eternal Garden — Family Niche', customer:'Kelvin Goh', status:'Void', mode:'NETS', trxDate:'16 Feb 2026', remarks:'Duplicate entry', createdBy:'Grace Lim', createdAt:'16 Feb 2026, 1:20 PM', invoiceNo:'INV000216', amount:900 },
    { id:'8', receiptNo:'RCT000508', fileNo:'F0004828', product:'Lotus Court — Single Niche', customer:'Farah Yusof', status:'Paid', mode:'GIRO', trxDate:'20 Feb 2026', remarks:'Auto-debit', createdBy:'Daniel Ng', createdAt:'20 Feb 2026, 3:08 PM', invoiceNo:'INV000217', amount:1350 },
  ];
  var STATUS_VARIANT = { 'Paid':'light-success', 'Void':'light-danger' };

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || '1';
  var d = DATA.find(function(x){ return x.id === id; }) || DATA[0];
  var c = NvsChrome.customer(d.customer);
  var state = { remarksModalOpen: false, remarksDraft: d.remarks };

  document.title = d.receiptNo + ' — NVS-OS Prototype';
  document.getElementById('rcptTitle').textContent = 'Receipt Details — ' + d.receiptNo;
  document.getElementById('rcptSub').textContent = 'Created by ' + d.createdBy + ' on ' + d.createdAt;
  document.getElementById('statusRow').innerHTML =
    '<span class="badge ' + STATUS_VARIANT[d.status] + '">' + NvsChrome.esc(d.status) + '</span>' +
    '<div class="avatar-chip"><div class="mini-avatar">' + NvsChrome.esc(d.createdBy.split(' ').map(function(w){return w[0];}).join('')) + '</div><div class="mini-name">' + NvsChrome.esc(d.createdBy) + ' · Service Agent</div></div>';

  document.getElementById('f-amount').textContent = NvsChrome.money(d.amount);
  document.getElementById('f-trxDate').textContent = d.trxDate;
  document.getElementById('f-mode').textContent = d.mode;
  document.getElementById('f-bankDesc').textContent = 'NIRVANA MEM GDN — ' + d.mode + ' REF' + (100000 + Number(d.id) * 37);

  function renderRemarks(){
    document.getElementById('f-remarks').textContent = state.remarksDraft || 'No remarks added.';
  }
  renderRemarks();

  var fileEl = document.getElementById('f-fileNo');
  fileEl.textContent = d.fileNo;
  fileEl.addEventListener('click', function(){ NvsChrome.toast('Opening file ' + d.fileNo); });
  document.getElementById('f-product').textContent = d.product;
  document.getElementById('f-custName').textContent = d.customer;
  document.getElementById('f-nric').textContent = c.nric;
  document.getElementById('f-mobile').textContent = c.mobile;
  document.getElementById('f-email').textContent = c.email;

  document.getElementById('allocBody').innerHTML =
    '<tr><td class="sr-id">' + NvsChrome.esc(d.invoiceNo) + '</td><td>' + NvsChrome.esc(d.product) + '</td><td class="num">' + NvsChrome.money(d.status === 'Void' ? 0 : d.amount) + '</td></tr>';

  document.getElementById('attachments').innerHTML =
    '<div class="attachment-row"><div class="attachment-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div><div><div class="attachment-name">Bank Transfer Slip.jpg</div><div class="attachment-meta">312 KB · uploaded by ' + NvsChrome.esc(d.createdBy) + ' on ' + d.trxDate + '</div></div></div>';

  var timelineItems = [
    { label: 'Payment received via ' + d.mode, meta: d.createdAt, dot: '' },
    { label: 'Receipt generated', meta: d.createdAt + ' · ' + d.createdBy, dot: '' },
  ];
  if(d.status === 'Void'){
    timelineItems.push({ label: 'Receipt voided — ' + d.remarks, meta: '1 day later · ' + d.createdBy, dot: '' });
  }
  document.getElementById('timeline').innerHTML = timelineItems.map(function(t){
    return '<li><div class="dot ' + t.dot + '"></div><div><div class="t-label">' + NvsChrome.esc(t.label) + '</div><div class="t-meta">' + NvsChrome.esc(t.meta) + '</div></div></li>';
  }).join('');

  function renderModal(){
    document.getElementById('modalRoot').innerHTML = state.remarksModalOpen ?
      '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">' +
        '<h2>Edit Remarks — ' + NvsChrome.esc(d.receiptNo) + '</h2>' +
        '<div class="field-wrap"><textarea class="modal-textarea" id="remarksInput">' + NvsChrome.esc(state.remarksDraft) + '</textarea></div>' +
        '<div class="modal-actions"><div class="btn-text" id="modalCancel">Cancel</div><div class="btn-confirm" id="modalSave">Save</div></div>' +
      '</div></div>' : '';
    var backdrop = document.getElementById('modalBackdrop');
    if(backdrop){
      backdrop.addEventListener('click', function(e){ if(e.target === backdrop){ state.remarksModalOpen = false; renderModal(); } });
      document.getElementById('modalCancel').addEventListener('click', function(){ state.remarksModalOpen = false; renderModal(); });
      document.getElementById('remarksInput').addEventListener('input', function(e){ state.remarksDraft = e.target.value; });
      document.getElementById('modalSave').addEventListener('click', function(){
        state.remarksModalOpen = false; renderModal(); renderRemarks();
        NvsChrome.toast('Remarks updated');
      });
    }
  }
  document.getElementById('editRemarksBtn').addEventListener('click', function(){ state.remarksModalOpen = true; renderModal(); });

  document.getElementById('kebabBtn').addEventListener('click', function(e){
    e.stopPropagation();
    document.getElementById('kebabMenu').hidden = !document.getElementById('kebabMenu').hidden;
  });
  document.getElementById('downloadItem').addEventListener('click', function(){ document.getElementById('kebabMenu').hidden = true; NvsChrome.toast('Downloading ' + d.receiptNo + '.pdf'); });
  document.getElementById('emailItem').addEventListener('click', function(){ document.getElementById('kebabMenu').hidden = true; NvsChrome.toast('Receipt emailed to ' + d.customer); });
  document.addEventListener('click', function(){ document.getElementById('kebabMenu').hidden = true; });
})();
</script>
</body>
</html>
